# @package hybrid
# Search plus language model (D21, experiment E7): experiments/hybrid/run_hybrid.py
# A hit is trusted when its E-value is at or below the threshold, chosen on validation.
evalue_thresholds: [1.0e-50, 1.0e-30, 1.0e-20, 1.0e-10, 1.0e-5, 1.0e-3, 1.0e-2, 0.1, 1.0, 10.0]
lora_predictions_dir: experiments/lora/r8_650M   # val_predictions.npz and test_predictions.npz
evaluate_test: true                 # false: choose on validation and never read test predictions
n_bootstrap: 1000                   # stratified cluster-bootstrap resamples for the 95% CIs (D3)
seed: 42
work_dir: data/hybrid               # validation search, not tracked
output_dir: experiments/hybrid/results
